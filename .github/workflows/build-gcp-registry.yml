name: Build and Push to Artifact Registry

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  PROJECT_ID: tg-aggregator
  REGION: europe-north1
  GAR_LOCATION: europe-north1-docker.pkg.dev/tg-aggregator/aggregator-repo

jobs:
  build-push-artifact:
    runs-on: ubuntu-latest
    
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"  # Updated to latest version
      
      - id: "auth"  # Fixed: proper indentation
        uses: "google-github-actions/auth@v1"
        with:
          credentials_json: "${{ secrets.GCP_SERVICE_ACCOUNT }}"
      
      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v1"
      
      - name: "Use gcloud CLI"
        run: "gcloud info"
      
      - name: "Docker auth"
        run: |-
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      
      - name: Build image
        run: |
          # Use GitHub SHA for unique tagging
          docker build . --file Dockerfile --tag ${{ env.GAR_LOCATION }}/aggregator:${{ github.sha }}
          docker build . --file Dockerfile --tag ${{ env.GAR_LOCATION }}/aggregator:latest
      
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.GAR_LOCATION }}/aggregator:${{ github.sha }}
          docker push ${{ env.GAR_LOCATION }}/aggregator:latest
