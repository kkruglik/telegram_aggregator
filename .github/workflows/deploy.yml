name: Deploy to VM (Traditional SSH + Registry)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'
        type: string

env:
  PROJECT_ID: tg-aggregator
  GAR_LOCATION: europe-north1-docker.pkg.dev/tg-aggregator/aggregator-repo

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: "Checkout deployment files"
        uses: "actions/checkout@v4"
        with:
          sparse-checkout: |
            docker-compose.build.yaml
            Makefile

          sparse-checkout-cone-mode: false

      - name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v1"
        with:
          credentials_json: "${{ secrets.GCP_SERVICE_ACCOUNT }}"

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v1"

      - name: "Deploy to existing setup"
        run: |
          echo "🚀 Deploying registry images to existing telegram_aggregator directory"
          
          # Copy updated files
          gcloud compute scp docker-compose.build.yaml Makefile kirillkruglikov@${{ secrets.VM_INSTANCE_NAME }}:~/telegram_aggregator/ \
            --zone=${{ secrets.GCP_ZONE }} \
            --project=${{ env.PROJECT_ID }}
          
          # Execute deployment
          gcloud compute ssh kirillkruglikov@${{ secrets.VM_INSTANCE_NAME }} \
            --zone=${{ secrets.GCP_ZONE }} \
            --project=${{ env.PROJECT_ID }} \
            --command="
              cd ~/telegram_aggregator
              
              echo '🔐 Authenticating Docker for registry...'
              gcloud auth configure-docker europe-north1-docker.pkg.dev --quiet
              
              echo '📥 Pulling registry images...'
              docker pull ${{ env.GAR_LOCATION }}/scraper:${{ inputs.image_tag }}
              docker pull ${{ env.GAR_LOCATION }}/aggregator:${{ inputs.image_tag }}
              
              echo '🏷️  Tagging registry images with local names...'
              docker tag ${{ env.GAR_LOCATION }}/scraper:${{ inputs.image_tag }} telegram_aggregator-scraper:latest
              docker tag ${{ env.GAR_LOCATION }}/aggregator:${{ inputs.image_tag }} telegram_aggregator-aggregator:latest
              
              echo '▶️  Starting with new images...'
              make deploy
            "