name: Deploy to VM

on:
  workflow_run:
    workflows: ["Build and Push to Artifact Registry"]
    types: [completed]
    branches: ["main"]

env:
  PROJECT_ID: tg-aggregator
  GAR_LOCATION: europe-north1-docker.pkg.dev/tg-aggregator/aggregator-repo

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: "Checkout deployment files"
        uses: "actions/checkout@v4"
        with:
          sparse-checkout: |
            docker-compose.deploy.yaml
            Makefile

          sparse-checkout-cone-mode: false

      - name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v1"
        with:
          credentials_json: "${{ secrets.GCP_SERVICE_ACCOUNT }}"

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v3"

      - name: "Deploy to existing setup"
        run: |
          echo "🚀 Deploying registry images to existing telegram_aggregator directory"
          
          # Copy updated files
          gcloud compute scp docker-compose.deploy.yaml Makefile kirillkruglikov@${{ secrets.VM_INSTANCE_NAME }}:~/telegram_aggregator/ \
            --zone=${{ secrets.GCP_ZONE }} \
            --project=${{ env.PROJECT_ID }}
          
          # Execute deployment
          gcloud compute ssh kirillkruglikov@${{ secrets.VM_INSTANCE_NAME }} \
            --zone=${{ secrets.GCP_ZONE }} \
            --project=${{ env.PROJECT_ID }} \
            --command="
              cd ~/telegram_aggregator
              
              echo '🔐 Authenticating Docker for registry...'
              gcloud auth configure-docker europe-north1-docker.pkg.dev --quiet
              
              echo '📥 Pulling registry images...'
              docker pull ${{ env.GAR_LOCATION }}/scraper:latest
              docker pull ${{ env.GAR_LOCATION }}/aggregator:latest
              
              echo '🏷️  Tagging registry images with local names...'
              docker tag ${{ env.GAR_LOCATION }}/scraper:latest telegram_aggregator-scraper:latest
              docker tag ${{ env.GAR_LOCATION }}/aggregator:latest telegram_aggregator-aggregator:latest
              
              echo '▶️  Starting with new images...'
              make deploy
            "