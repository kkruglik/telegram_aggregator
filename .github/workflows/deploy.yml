name: Deploy to VM

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'
        type: string

env:
  PROJECT_ID: tg-aggregator
  REGION: europe-north1
  GAR_LOCATION: europe-north1-docker.pkg.dev/tg-aggregator/aggregator-repo

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: "Checkout deployment files"
        uses: "actions/checkout@v4"
        with:
          sparse-checkout: |
            docker-compose.prod.yaml
            .env.prod
          sparse-checkout-cone-mode: false

      - name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v1"
        with:
          credentials_json: "${{ secrets.GCP_SERVICE_ACCOUNT }}"

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v1"

      - name: "Enable OS Login on VM (if not enabled)"
        run: |
          gcloud compute instances add-metadata ${{ secrets.VM_INSTANCE_NAME }} \
            --zone=${{ secrets.GCP_ZONE }} \
            --metadata enable-oslogin=TRUE || true

      - name: "Deploy to VM"
        run: |
          echo "🚀 Deploying images with tag: ${{ inputs.image_tag }}"
          
          # Create deployment script
          cat > deploy_script.sh << 'EOF'
          #!/bin/bash
          set -e
          
          cd /opt/app
          
          echo '🔐 Setting up Docker authentication...'
          gcloud auth configure-docker europe-north1-docker.pkg.dev --quiet
          
          echo '📥 Pulling images...'
          docker pull europe-north1-docker.pkg.dev/tg-aggregator/aggregator-repo/scraper:TAG_PLACEHOLDER
          docker pull europe-north1-docker.pkg.dev/tg-aggregator/aggregator-repo/aggregator:TAG_PLACEHOLDER
          
          echo '🏷️  Tagging as latest...'
          docker tag europe-north1-docker.pkg.dev/tg-aggregator/aggregator-repo/scraper:TAG_PLACEHOLDER europe-north1-docker.pkg.dev/tg-aggregator/aggregator-repo/scraper:latest
          docker tag europe-north1-docker.pkg.dev/tg-aggregator/aggregator-repo/aggregator:TAG_PLACEHOLDER europe-north1-docker.pkg.dev/tg-aggregator/aggregator-repo/aggregator:latest
          
          echo '🔄 Stopping current services...'
          docker-compose -f docker-compose.prod.yaml down || true
          
          echo '▶️  Starting services...'
          docker-compose -f docker-compose.prod.yaml up -d
          
          echo '⏳ Waiting for services to start...'
          sleep 30
          
          echo '✅ Checking status...'
          docker-compose -f docker-compose.prod.yaml ps
          
          echo '🎉 Deployment complete!'
          EOF
          
          # Replace placeholder with actual tag
          sed -i "s/TAG_PLACEHOLDER/${{ inputs.image_tag }}/g" deploy_script.sh
          
          # Copy files to VM
          echo "📁 Copying deployment files..."
          gcloud compute scp docker-compose.prod.yaml ${{ secrets.VM_INSTANCE_NAME }}:/opt/app/ \
            --zone=${{ secrets.GCP_ZONE }}
          
          gcloud compute scp .env.prod ${{ secrets.VM_INSTANCE_NAME }}:/opt/app/.env \
            --zone=${{ secrets.GCP_ZONE }}
          
          gcloud compute scp deploy_script.sh ${{ secrets.VM_INSTANCE_NAME }}:/tmp/ \
            --zone=${{ secrets.GCP_ZONE }}
          
          # Execute deployment script
          echo "🚀 Executing deployment..."
          gcloud compute ssh ${{ secrets.VM_INSTANCE_NAME }} \
            --zone=${{ secrets.GCP_ZONE }} \
            --command="chmod +x /tmp/deploy_script.sh && /tmp/deploy_script.sh"