name: Deploy to VM (Traditional SSH + Registry)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'
        type: string

env:
  PROJECT_ID: tg-aggregator
  GAR_LOCATION: europe-north1-docker.pkg.dev/tg-aggregator/aggregator-repo
  VM_IP: 35.228.226.223

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: "Checkout deployment files"
        uses: "actions/checkout@v4"
        with:
          sparse-checkout: |
            docker-compose.deploy.yaml
            Makefile

          sparse-checkout-cone-mode: false


      - name: "Setup SSH connection"
        run: |
          # Create SSH directory
          mkdir -p ~/.ssh
          
          # Add private key (ensure proper line endings)
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Debug key format
          head -1 ~/.ssh/deploy_key
          
          # Add VM to known hosts
          ssh-keyscan -H ${{ env.VM_IP }} >> ~/.ssh/known_hosts
          
          # Test SSH connection
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=10 kirillkruglikov@${{ env.VM_IP }} "echo 'SSH connection successful'"

      - name: "Deploy to VM"
        run: |
          echo "🚀 Deploying registry images to existing telegram_aggregator directory"
          
          # Copy updated files
          echo "📁 Copying files..."
          scp -i ~/.ssh/deploy_key docker-compose.deploy.yaml kirillkruglikov@${{ env.VM_IP }}:~/telegram_aggregator/
          scp -i ~/.ssh/deploy_key Makefile kirillkruglikov@${{ env.VM_IP }}:~/telegram_aggregator/Makefile
          
          # Execute deployment
          ssh -i ~/.ssh/deploy_key kirillkruglikov@${{ env.VM_IP }} "
              cd ~/telegram_aggregator
          
              echo '🔐 Authenticating Docker for registry...'
              echo '${{ secrets.GCP_SERVICE_ACCOUNT }}' | base64 -d > /tmp/gcp-key.json
              gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
              gcloud auth configure-docker europe-north1-docker.pkg.dev --quiet
              rm /tmp/gcp-key.json
          
              echo '📥 Pulling registry images...'
              docker pull ${{ env.GAR_LOCATION }}/scraper:${{ inputs.image_tag }}
              docker pull ${{ env.GAR_LOCATION }}/aggregator:${{ inputs.image_tag }}
          
              echo '🏷️  Tagging registry images with local names...'
              docker tag ${{ env.GAR_LOCATION }}/scraper:${{ inputs.image_tag }} telegram_aggregator-scraper:latest
              docker tag ${{ env.GAR_LOCATION }}/aggregator:${{ inputs.image_tag }} telegram_aggregator-aggregator:latest
          
              echo '▶️  Starting with new images...'
              make deploy
            "