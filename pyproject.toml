[project]
name = "telegram-aggregator-bot"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.18.0",
    "aiohttp>=3.11.13",
    "alembic>=1.15.2",
    "apscheduler>=3.11.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.12",
    "google-cloud-logging>=3.12.1",
    "google-cloud-secret-manager>=2.23.3",
    "openai>=2.38.0",
    "pymorphy3>=2.0.2",
    "python-dotenv>=1.1.0",
    "pytz>=2025.2",
    "pyyaml>=6.0.2",
    "telethon>=1.39.0",
    "tenacity>=9.1.4",
    "uvicorn>=0.34.2",
]

[dependency-groups]
dev = [
    "hypothesis>=6.135.14",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0.0",
    "pytest-mock>=3.14.1",
    "ruff>=0.11.8",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = ["RUF001"]
