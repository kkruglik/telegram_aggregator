version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: news_aggregator_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tg_network

  aggregator:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: tg_aggregator
    environment:
      - CONFIG_NAME=config-local-docker.yaml
    volumes:
      - ./logs:/app/logs
      - ./src:/app/src
      - ./config:/app/config
      - ~/.config/gcloud:/root/.config/gcloud
      - ./telegram_scraper.session:/app/telegram_scraper.session
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tg_network

networks:
  tg_network:
    driver: bridge

volumes:
  postgres_data: