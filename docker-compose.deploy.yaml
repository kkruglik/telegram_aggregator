version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: news_aggregator_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tg_network

  scraper:
    image: europe-north1-docker.pkg.dev/tg-aggregator/aggregator-repo/scraper:latest
    container_name: tg_scraper
    restart: unless-stopped
    environment:
      - CONFIG_NAME=config-prod.yaml
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /opt/app/logs/scraper:/app/logs
      - ~/.config/gcloud:/root/.config/gcloud:ro
      - /opt/app/telegram_scraper.session:/app/telegram_scraper.session
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tg_network

  aggregator:
    image: europe-north1-docker.pkg.dev/tg-aggregator/aggregator-repo/aggregator:latest
    container_name: tg_aggregator
    restart: unless-stopped
    environment:
      - CONFIG_NAME=config-prod.yaml
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
    volumes:
      - /opt/app/logs/aggregator:/app/logs
      - ~/.config/gcloud:/root/.config/gcloud:ro
    depends_on:
      postgres:
        condition: service_healthy
      scraper:
        condition: service_started
    networks:
      - tg_network

networks:
  tg_network:
    driver: bridge

volumes:
  postgres_data: