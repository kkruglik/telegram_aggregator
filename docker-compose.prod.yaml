version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: news_aggregator_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tg_network

  scraper:
    build:
      context: ./services/scraper
      dockerfile: Dockerfile
    container_name: tg_scraper
    environment:
      - CONFIG_NAME=config-prod.yaml
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
    ports:
      - "8000:8000"
    volumes:
      - ./services/scraper/logs:/app/logs
      - ./services/scraper/src:/app/src
      - ~/.config/gcloud:/root/.config/gcloud
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tg_network

  aggregator:
    build:
      context: ./services/aggregator
      dockerfile: Dockerfile
    container_name: tg_aggregator
    environment:
      - CONFIG_NAME=config-prod.yaml
    volumes:
      - ./services/aggregator/logs:/app/logs
      - ./services/aggregator/src:/app/src
      - ~/.config/gcloud:/root/.config/gcloud
    depends_on:
      postgres:
        condition: service_healthy
      scraper:
        condition: service_started
    networks:
      - tg_network

networks:
  tg_network:
    driver: bridge

volumes:
  postgres_data: