version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: news_aggregator_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tg_network

  scraper:
    build:
      context: .
      dockerfile: tg_scraper_src/Dockerfile
    container_name: tg_scraper
    restart: unless-stopped
    environment:
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tg_network

  aggregator:
    build:
      context: .
      dockerfile: tg_aggregator_src/Dockerfile
    container_name: tg_aggregator
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - POSTGRES_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=5432
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - SCRAPER_URL=http://scraper:8000
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      scraper:
        condition: service_started
    networks:
      - tg_network

networks:
  tg_network:
    driver: bridge

volumes:
  postgres_data: